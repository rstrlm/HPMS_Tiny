services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pms-mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pms-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./scripts/init-databases.sql:/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "mssql", "-U", "sa", "-P", "YourStrong!Passw0rd", "-C", "-i", "/init.sql"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: pms-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/pms-realm.json:/opt/keycloak/data/import/pms-realm.json:ro

  api:
    build:
      context: .
      dockerfile: src/Pms.Api/Dockerfile
    container_name: pms-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PmsDb=Server=mssql,1433;Database=pms_db;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true
      - Keycloak__Authority=http://localhost:8080/realms/pms
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/pms/.well-known/openid-configuration
      - Keycloak__ClientId=pms-api
      - KeycloakAdmin__BaseUrl=http://keycloak:8080
      - KeycloakAdmin__Realm=pms
      - KeycloakAdmin__AdminRealm=master
      - KeycloakAdmin__ClientId=admin-cli
      - KeycloakAdmin__AdminUsername=admin
      - KeycloakAdmin__AdminPassword=admin
      # Branding (override to customize for your property)
      # - Branding__CompanyName=Hotel PMS 
      # - Branding__CompanyLegalName=Hotel PMS Oy
      # - Branding__Tagline=Hotel Property Management System
      # - Branding__Address=hotel street 123, 00100 Helsinki, Finland
      # - Branding__Email=pms@example.com
      # - Branding__Phone=+358 3 123 4567
      # - Branding__TaxId=1234567-8
      # - Branding__BankName=Nordea Finland
      # - Branding__IBAN=FI12 3456 7890 1234 56
      # - Branding__BIC=NDEAFIHH
    ports:
      - "5134:8080"
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mssql_data:
